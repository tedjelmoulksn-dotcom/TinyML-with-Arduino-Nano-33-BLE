<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="470" viewBox="0 0 1100 470" role="img" aria-labelledby="title desc">
<title id="title">TinyML acquisition and inference workflows</title><desc id="desc">IMU samples pass through CSV collection and TensorFlow training to Arduino inference. Camera data passes through Edge Impulse inference and serial reception; Node-RED counting and dashboard nodes remain to be integrated.</desc>
